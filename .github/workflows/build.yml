name: Build APK

on:
  push:
    branches: [lens-learn]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        run: base64 -d signing/release.keystore.b64 > app/release.keystore

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Copy APK
        if: success()
        run: mkdir out && cp app/build/outputs/apk/release/app-release.apk out/LensLearn.apk

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lens-learn
          target_commitish: ${{ github.sha }}
          name: מצלמים ולומדים – אפליקציית אנדרואיד
          body: "הורידו את LensLearn.apk בטלפון ואשרו התקנה. (build ${{ github.run_number }}, commit ${{ github.sha }})"
          make_latest: true
          files: out/LensLearn.apk

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          mkdir logout
          tail -c 60000 build.log > logout/build.log || echo "no log" > logout/build.log
          echo "${GITHUB_SHA}" > logout/commit.txt
          cd logout
          git init -q -b lens-learn-log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add . && git commit -q -m "log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" lens-learn-log
